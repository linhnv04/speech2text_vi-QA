<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #10a37f;
            --secondary-color: #0e8e6d;
            --background-color: #343541;
            --chat-bg: #444654;
            --sidebar-bg: #202123;
            --user-message-bg: #343541;
            --bot-message-bg: #444654;
            --text-color: #ffffff;
            --text-secondary: #c5c5d2;
            --border-color: #565869;
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .new-chat {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }

        .new-chat:hover {
            background-color: var(--secondary-color);
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px;
            border-radius: var(--border-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }

        .history-item:hover {
            background-color: var(--chat-bg);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-message {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            display: flex;
            gap: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar {
            background-color: var(--primary-color);
        }

        .bot-avatar {
            background-color: #5436da;
        }

        .message-content {
            flex-grow: 1;
        }

        .message-text {
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .timestamp {
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .input-container {
            padding: 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            position: relative;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .transcription-box {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--background-color);
            color: var(--text-color);
            resize: none;
            min-height: 52px;
            max-height: 200px;
            font-family: inherit;
        }

        .transcription-box:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .voice-controls {
            position: absolute;
            right: 10px;
            bottom: 10px;
            display: flex;
            gap: 8px;
        }

        .voice-button {
            background: none;
            color: var(--text-secondary);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .voice-button:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .voice-button.recording {
            color: #ff4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clear-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px;
            border-radius: var(--border-radius);
            transition: all 0.3s ease;
        }

        .clear-button:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .status-indicator {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>
<body>
    <div class="sidebar">
        <button class="new-chat" onclick="clearChat()">
            <i class="fas fa-plus"></i>
            New Chat
        </button>
        <div class="chat-history" id="chatHistory">
            <!-- Chat history items will be added here -->
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="chatBox"></div>
        
        <div class="input-container">
            <button class="clear-button" onclick="clearChat()">
                <i class="fas fa-trash"></i>
                Clear Chat
            </button>
            
            <div class="input-wrapper">
                <textarea 
                    class="transcription-box" 
                    id="transcriptionBox" 
                    placeholder="Your voice will appear here..."
                    readonly
                ></textarea>
                
                <div class="voice-controls">
                    <button class="voice-button" id="recordButton" onclick="toggleRecording()">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <button class="voice-button" id="playButton" onclick="playRecording()" disabled>
                        <i class="fas fa-play"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = "http://127.0.0.1:5000";
        let isRecording = false;
        let audioBlob = null;

        function toggleRecording() {
            const recordButton = document.getElementById('recordButton');
            const playButton = document.getElementById('playButton');
            const transcriptionBox = document.getElementById('transcriptionBox');
            
            if (!isRecording) {
                // Start recording
                isRecording = true;
                recordButton.classList.add('recording');
                recordButton.innerHTML = '<i class="fas fa-stop"></i>';
                transcriptionBox.value = 'Recording...';
                
                fetch(`${SERVER_URL}/record_audio`, { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.message === "Audio recorded successfully") {
                            return fetch(`${SERVER_URL}/transcribe`);
                        }
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.question) {
                            transcriptionBox.value = data.question;
                            playButton.disabled = false;
                        } else {
                            transcriptionBox.value = 'No speech detected';
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        transcriptionBox.value = 'Error recording audio';
                    });
            } else {
                // Stop recording
                isRecording = false;
                recordButton.classList.remove('recording');
                recordButton.innerHTML = '<i class="fas fa-microphone"></i>';
            }
        }

        function playRecording() {
            const audio = new Audio(`${SERVER_URL}/cache/temp_audio_file.wav`);
            audio.play();
        }

        function sendMessage() {
            const transcriptionText = document.getElementById('transcriptionBox').value;
            if (transcriptionText && transcriptionText !== 'Your voice will appear here...' && transcriptionText !== 'Recording...') {
                addMessage(transcriptionText, 'user');
                
                fetch(`${SERVER_URL}/respond`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: transcriptionText })
                })
                .then(response => response.json())
                .then(data => {
                    addMessage(data.response, 'bot');
                })
                .catch(error => console.error('Error:', error));
                
                document.getElementById('transcriptionBox').value = '';
                document.getElementById('playButton').disabled = true;
            }
        }

        function addMessage(text, sender) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `chat-message ${sender}-message`;
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender}-avatar`;
            avatar.innerHTML = sender === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            const messageText = document.createElement('div');
            messageText.className = 'message-text';
            messageText.innerHTML = marked.parse(text);
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = new Date().toLocaleTimeString();
            
            content.appendChild(messageText);
            content.appendChild(timestamp);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = '';
            document.getElementById('transcriptionBox').value = '';
            document.getElementById('playButton').disabled = true;
        }

        // Add keyboard shortcut for sending message
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
